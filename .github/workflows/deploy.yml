name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm exec -- playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Generate EPUB
        run: npm run export:epub

      - name: Generate PDF and site
        run: npm run export:pdf

      - name: Verify built site
        run: |
          npm run preview -- --host 127.0.0.1 --port 4328 > /tmp/magus-preview.log 2>&1 &
          preview_pid=$!
          trap "kill $preview_pid" EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:4328/magus-book/ >/dev/null; then
              MAGUS_BASE_URL=http://127.0.0.1:4328/magus-book npm run verify:site
              exit 0
            fi
            sleep 1
          done
          cat /tmp/magus-preview.log
          exit 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
